COM_PUNGAMAIL_CONFIG_REMINDER_NOTE="Punga Mail kann Sie daran erinnern, wenn längere Zeit kein Newsletter versendet wurde. Die Erinnerung wird einmal für den zuletzt abgeschlossenen Newsletter gesendet, sobald die unten eingestellte Zahl von Tagen vergangen ist. Damit die Funktion arbeitet, muss zusätzlich unter Joomlas geplanten Aufgaben „Punga Mail — Newsletter-Erinnerung“ eingerichtet und aktiviert sein."
COM_PUNGAMAIL_CONFIG_REMINDER_ENABLED_DESC="Schaltet die Erinnerungsprüfung ein oder aus. Zusätzlich muss in Joomla die geplante Aufgabe „Punga Mail — Newsletter-Erinnerung“ aktiviert sein."
