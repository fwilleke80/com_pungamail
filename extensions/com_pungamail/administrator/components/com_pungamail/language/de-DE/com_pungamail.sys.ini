COM_PUNGAMAIL_EDIT_SUBSCRIBER="Abonnent bearbeiten"
COM_PUNGAMAIL_EDIT_SUBSCRIBER_HELP="Verwalten Sie, ob diese Person Newsletter erhält und welchen Kanälen sie zugeordnet ist. Änderungen an Kanälen schalten den Newsletter-Empfang nicht ein oder aus und heben keine Versandsperre auf. Wenn Sie eine abgemeldete oder gesperrte Person ausdrücklich auf „Abonniert“ setzen, gilt dies als neue Anmeldung durch einen Administrator und der Versand wird wieder erlaubt."
COM_PUNGAMAIL_RECIPIENT_NAME="Empfängername"
COM_PUNGAMAIL_RECIPIENT_NAME_DESC="Optionaler Anzeigename für externe Abonnenten. Bei verknüpften Joomla-Benutzern wird deren Joomla-Anzeigename verwendet."
COM_PUNGAMAIL_SUBSCRIPTION_STATUS_EDIT_DESC="Legt fest, ob diese Person Newsletter erhalten darf. Wenn Sie eine abgemeldete oder gesperrte Person auf „Abonniert“ setzen, gilt dies als ausdrückliche Anmeldung durch einen Administrator und der Versand wird wieder erlaubt. „Bestätigung ausstehend“ kann nur bei einer bereits laufenden Bestätigung beibehalten werden."
COM_PUNGAMAIL_SUBSCRIBER_TOPICS_HELP="Wählen Sie die Kanäle dieses Abonnenten. Unveröffentlichte Kanäle werden hier weiterhin angezeigt, damit bestehende Zuordnungen gepflegt werden können; auf der öffentlichen Anmeldeseite werden sie nicht angeboten."
