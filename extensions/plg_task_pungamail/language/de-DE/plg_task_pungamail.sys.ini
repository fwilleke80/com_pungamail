PLG_TASK_PUNGAMAIL_GENERATE_DIGESTS_DESC="Für wiederkehrende automatische Newsletter. Sobald ein automatischer Newsletter fällig ist, sucht diese Aufgabe passende neue Inhalte und erstellt daraus einen Entwurf oder bereitet – wenn ausdrücklich eingestellt – den automatischen Versand vor. Sie ist nicht für normale Newsletter mit einem festen Versandzeitpunkt gedacht."
