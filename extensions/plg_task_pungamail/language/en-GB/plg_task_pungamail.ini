PLG_TASK_PUNGAMAIL_PROCESS_QUEUE_TITLE="Punga Mail — Send pending newsletters"
PLG_TASK_PUNGAMAIL_PROCESS_QUEUE_DESC="Sends the next group of pending newsletter emails and tries temporary failures again when due."
PLG_TASK_PUNGAMAIL_NEWSLETTER_REMINDER="Punga Mail — Newsletter reminder"
