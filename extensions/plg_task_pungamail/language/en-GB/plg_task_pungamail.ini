PLG_TASK_PUNGAMAIL_NEWSLETTER_REMINDER_DESC="Sends the optional reminder when the last newsletter is older than the configured number of days."
PLG_TASK_PUNGAMAIL_PROCESS_QUEUE="Punga Mail — Send pending newsletters"
PLG_TASK_PUNGAMAIL_SCHEDULED_SENDS="Punga Mail — Prepare scheduled newsletters"
