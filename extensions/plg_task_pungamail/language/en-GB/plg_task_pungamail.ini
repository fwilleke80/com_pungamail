PLG_TASK_PUNGAMAIL_SCHEDULED_SENDS_DESC="For ordinary newsletters that you created manually and chose to send at a specific date and time. When that time arrives, this task prepares the newsletter for delivery. It is not used to create recurring Automatic Newsletters."
PLG_TASK_PUNGAMAIL_GENERATE_DIGESTS="Punga Mail — Create automatic newsletters"
PLG_TASK_PUNGAMAIL_GENERATE_DIGESTS_TITLE="Punga Mail — Create automatic newsletters"
PLG_TASK_PUNGAMAIL_GENERATE_DIGESTS_DESC="For recurring Automatic Newsletters. When an Automatic Newsletter is due, this task finds eligible new content and creates it as a draft or, if explicitly configured, prepares it for automatic delivery. It is not used for ordinary newsletters scheduled for a specific date."
PLG_TASK_PUNGAMAIL_PROCESS_BOUNCES="Punga Mail — Check returned mail"
