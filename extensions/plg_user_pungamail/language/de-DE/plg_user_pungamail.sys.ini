PLG_USER_PUNGAMAIL_DESCRIPTION="Fügt Joomla-Benutzerprofilen die globale Punga-Mail-Newsletter-Einstellung und die Themenauswahl hinzu."
PLG_USER_PUNGAMAIL_FIELDSET_LABEL="Newsletter"
PLG_USER_PUNGAMAIL_SUBSCRIBED_LABEL="Newsletter erhalten"
PLG_USER_PUNGAMAIL_SUBSCRIBED_DESC="Legt fest, ob dieses Benutzerkonto überhaupt Punga-Mail-Newsletter erhalten darf. Ein globales Nein hat Vorrang vor jeder Themen- und Joomla-Benutzergruppenauswahl."
PLG_USER_PUNGAMAIL_TOPICS_LABEL="Newsletter-Themen"
PLG_USER_PUNGAMAIL_TOPICS_DESC="Wählen Sie die veröffentlichten Themen, die dieses Benutzerkonto erhalten möchte. Ohne Themenauswahl können weiterhin Newsletter für alle bestätigten Abonnenten oder eine passende Joomla-Benutzergruppe empfangen werden. Die Themenauswahl bleibt bei globalem Nein erhalten, es wird jedoch keine Mail zugestellt, bis die Einstellung wieder aktiviert wird."
