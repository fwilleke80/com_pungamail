PLG_USER_PUNGAMAIL="User - Punga Mail"
PLG_USER_PUNGAMAIL_DESCRIPTION="Adds the Punga Mail global newsletter preference and topic choices to Joomla user profiles."
PLG_USER_PUNGAMAIL_FIELDSET_LABEL="Newsletter"
PLG_USER_PUNGAMAIL_SUBSCRIBED_LABEL="Receive newsletter"
PLG_USER_PUNGAMAIL_SUBSCRIBED_DESC="Controls whether this account may receive Punga Mail newsletters at all. A global No overrides every topic and Joomla user-group selection."
PLG_USER_PUNGAMAIL_TOPICS_LABEL="Newsletter topics"
PLG_USER_PUNGAMAIL_TOPICS_DESC="Choose the published topics this account wants. Leaving all topics clear does not exclude newsletters sent to all confirmed subscribers or an eligible Joomla user group. Topic choices are retained when the global preference is No, but no mail is delivered until it is enabled again."
